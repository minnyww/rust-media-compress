[package]
name = "media-compressor"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time"] }
image = "0.25"
webp = "0.3"
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
